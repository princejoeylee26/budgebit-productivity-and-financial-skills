name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checks
        run: python3 scripts/check_skills.py
      - name: Tag matches VERSION
        run: test "v$(cat VERSION | tr -d '[:space:]')" = "${GITHUB_REF_NAME}"
      - name: Build skill zips
        run: scripts/package.sh
      - name: Release notes from CHANGELOG
        run: |
          v=$(cat VERSION | tr -d '[:space:]')
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "hachibu ${GITHUB_REF_NAME}" --notes-file notes.md
