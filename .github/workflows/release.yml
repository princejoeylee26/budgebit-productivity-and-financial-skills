name: release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Checks
        run: python3 scripts/check_skills.py
      - name: Tag matches VERSION
        run: test "v$(cat VERSION | tr -d '[:space:]')" = "${TAG}"
      - name: Build skill zips
        run: scripts/package.sh
      - name: Release notes from CHANGELOG
        run: |
          v=$(cat VERSION | tr -d '[:space:]')
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Works whether the tag was pushed or the release was created in the GitHub UI.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.zip --clobber
          else
            gh release create "${TAG}" dist/*.zip --title "hachibu ${TAG}" --notes-file notes.md
          fi
