name: checks

on:
  push:
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frontmatter, links, shared sync, personal-data scan
        run: python3 scripts/check_skills.py
      - name: energy_stats smoke test
        run: |
          echo '[{"title":"Build","list":"Work","status":"done","due_date":"2026-01-05","start_time":"09:00","due_time":"10:30"}]' > /tmp/t.json
          python3 .claude/skills/hachibu/scripts/energy_stats.py /tmp/t.json
